name: Build noindex preview of gomining-vip@overhaul
# Pulls the PUBLIC overhaul branch of RingoshiToitsu1/gomining-vip (no token needed), makes it
# safe to host here, and publishes it with the same GitHub Pages server the live site uses.
#   - CNAME removed: this preview can never claim gmt-optimizer.com
#   - robots.txt = Disallow: /   and   <meta name="robots" content="noindex,nofollow"> on every page
on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'gomining-vip ref to build (default overhaul; used for before/after measurements)'
        required: false
        default: overhaul
  schedule:
    - cron: '*/30 * * * *'   # fallback; pushes to overhaul also trigger it via `gh workflow run`
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  preview:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: RingoshiToitsu1/gomining-vip
          ref: ${{ inputs.ref || 'overhaul' }}
          path: src
      - uses: actions/configure-pages@v4
      - name: Apply data/config.json (same as production deploy)
        working-directory: src
        run: |
          if [ -f scripts/build-config.js ]; then node scripts/build-config.js; else echo "older code, no scripts/build-config.js, skipped"; fi
      - name: Regenerate data pages (same as production deploy)
        working-directory: src
        run: |
          if [ -f scripts/gen-pages.js ]; then node scripts/gen-pages.js; else echo "older code, no scripts/gen-pages.js, skipped"; fi
        continue-on-error: true
      - name: Translate pages (same as production deploy)
        working-directory: src
        run: |
          if [ -f scripts/gen-i18n.js ]; then node scripts/gen-i18n.js && node scripts/build-config.js; else echo "older code, no scripts/gen-i18n.js, skipped"; fi
      - name: Stage site exactly like production (no hidden folders)
        run: mkdir -p "$RUNNER_TEMP/site" && cd src && tar --exclude='./.*' -cf - . | tar -xf - -C "$RUNNER_TEMP/site"
      - name: Make it a safe, unindexable preview
        working-directory: ${{ runner.temp }}/site
        run: |
          rm -f CNAME
          printf 'User-agent: *\nDisallow: /\n' > robots.txt
          # every page: drop any existing robots meta, add noindex,nofollow right after <head>
          find . -name '*.html' -print0 | while IFS= read -r -d '' f; do
            perl -0pi -e 's{<meta\s+name="robots"[^>]*>\s*}{}gi; s{<head([^>]*)>}{<head$1>\n<meta name="robots" content="noindex,nofollow">}i' "$f"
          done
          echo "pages: $(find . -name '*.html' | wc -l), noindexed: $(grep -rl 'content="noindex,nofollow"' --include=*.html . | wc -l)"
          test ! -e CNAME
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site
      - id: deployment
        uses: actions/deploy-pages@v4
